/* =====================================================================================
   STANDALONE TEMPLATE-2 BILL RENDERER — extracted verbatim from work.html (build 27/07-S)
   No Supabase client, no login, no app UI. Drawing code is byte-identical to the app.

   PUBLIC API:
     window.renderBill(data) -> Promise<{ long: string|null, pages: string[] }>
       long  = PNG dataURL of the tall long-bill canvas (null if export fails, e.g. taint)
       pages = JPEG dataURLs of the A4 pages (canvas.toBlob quality 0.82 — same as app)

   DATA SHAPE (exactly what the extracted functions consume):
   data = {
     order: {                          // one row of orders with joins (regenBillImages shape)
       id, order_no, total,            // total = items subtotal (number)
       customers: {
         id, code, name, sale_id,      // sale_id links into data.sales for billContact
         contact_name, phone, billing_address, tax_id,
         ship_shop_name, ship_receiver, ship_phone, ship_address,
         receive_time                  // optional extras (branch_name, note, ...) are ignored
       },
       order_items: [{
         qty, price, amount, product_id,
         products: { name, unit }      // name/unit drawn from the join;
       }]                              // sku + image come from data.products by product_id!
     },
     billNo: 'IV680801-001',           // drawn top-right + CODE128 barcode content
     extra: {                          // optional — may also be flattened onto data itself
       shipFee: 0, discount: 0,        // numbers; row drawn only when non-zero
       grand: null,                    // net total; default Number(order.total)
       revision: 1,
       docType: 'บิลเงินสด',            // document title
       sellerMode: 'none'|'brief'|'full'  // seller block detail level (legacy fullForm ok)
     },
     products: [{ id, sku, name, unit, image_url }],  // GLOBAL lookup used by drawBill/prodSku
                                       // (product thumbs + SKU column resolve from here,
                                       //  NOT from the order join). image_url may be a
                                       //  public storage URL or a data URI.
     sales: [{ id, name, phone, email }],             // for billContact (customer.sale_id)
     appSettings: {                    // shop fallbacks used by billContact
       shop_name, shop_phone, shop_email, shop_taxid, shop_address
     }
   }
   Notes:
   - The bill date is draw-time (th-TH Buddhist era), same as the app.
   - Remote images load via loadImg with crossOrigin='anonymous' (anti-taint, same as app);
     the storage bucket must serve CORS headers or the long PNG export returns null.
   - #cv is a single shared canvas — do not call renderBill concurrently.
   Demo: open bill-render.html?demo=1 to render a built-in mock bill (2 A4 pages).
   ===================================================================================== */

function wrapText(ctx,text,maxW){
  if(!text)return[];
  const chars=String(text).split('');
  const lines=[];let cur='';
  for(const ch of chars){
    if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}
    else cur+=ch;
  }
  if(cur)lines.push(cur);
  return lines;
}
function bahtText(num){
  // แปลงจำนวนเงินเป็นข้อความภาษาไทย
  num=Number(num);
  const txt1=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const txt2=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  function conv(n){
    n=String(parseInt(n,10)); let r='';
    const len=n.length;
    for(let i=0;i<len;i++){
      const d=+n[i], pos=len-i-1, unit=pos%6;
      if(d===0)continue;
      if(unit===0&&pos>=6){ r+=txt1[d]; }
      else if(unit===1&&d===1) r+='สิบ';
      else if(unit===1&&d===2) r+='ยี่สิบ';
      else if(unit===0&&d===1&&len>1&&i!==len-1) r+='เอ็ด';
      else r+=txt1[d]+txt2[unit];
      if(pos>=6&&pos%6===0&&i!==len-1) r+='ล้าน';
    }
    return r;
  }
  const parts=num.toFixed(2).split('.');
  let baht=conv(parts[0])||'ศูนย์';
  let s=baht+'บาท';
  if(parts[1]==='00') s+='ถ้วน';
  else s+=conv(parts[1])+'สตางค์';
  return s;
}
function loadImg(url){
  return new Promise(res=>{
    if(!url){res(null);return;}
    const img=new Image(); img.crossOrigin='anonymous';
    img.onload=()=>res(img); img.onerror=()=>res(null);
    img.src=url;
  });
}
function makeBarcode(text){
  try{
    const c=document.createElement('canvas');
    JsBarcode(c,text,{format:'CODE128',displayValue:false,margin:0,height:44,width:1.6});
    return c.toDataURL('image/png');
  }catch(e){return null;}
}

function billContact(c){
  const s=sales.find(x=>x.id===c.sale_id);
  return {
    shop: appSettings.shop_name||'Mixfresh',
    phone: (s&&s.phone) || appSettings.shop_phone || '',
    email: (s&&s.email) || appSettings.shop_email || '',
    creator: (s&&s.name) || 'Mixfresh',
    taxid: appSettings.shop_taxid||'',
    addr: appSettings.shop_address||''
  };
}
async function drawBill(o,billNo,extra){
  extra=extra||{};
  const _ship=Number(extra.shipFee)||0, _disc=Number(extra.discount)||0;
  const _grand=extra.grand!=null?Number(extra.grand):Number(o.total);

  const c=o.customers, items=o.order_items;

  const imgs={};
  await Promise.all(items.map(async it=>{
    const pid=it.product_id;

  const barcode=makeBarcode(billNo);

  // A4 สัดส่วน 210x297 → ใช้ 2480x3508 (300dpi) ย่อรับมือได้; ใช้ scale 2.7 ~ 2244x3175

  const cv=document.getElementById('cv');

function prodSku(pid){const p=products.find(x=>x.id===pid);return p?p.sku:'';}
function wrapText2(ctx,text,maxW,font){
  if(!text)return[];
  const prev=ctx.font; if(font)ctx.font=font;
  const words=String(text).split('');
  const lines=[];let cur='';
  for(const ch of words){
    if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}
    else cur+=ch;
  }
  if(cur)lines.push(cur);
  ctx.font=prev;
  return lines;
}

/* ---------- A4 pagination, verbatim from work.html lines 3449-3501 ---------- */
async function billToA4Pages(cvResult,billNo){
  const cv=cvResult.cv;
  const A4=297/210;                             // อัตราส่วนความสูง/กว้าง
  const S2=cv.width/794;
  const out=[];
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return c;};
  const toBlob=c=>new Promise(r=>c.toBlob(r,'image/jpeg',0.82));   // JPEG เล็กกว่า PNG มาก — รวม PDF ได้ไม่กินแรง

  const fitH=Math.round(cv.width*A4);            // ความสูง 1 หน้าเต็มความกว้าง
  if(cv.height<=fitH+2){                         // พอดีหน้าเดียว → วางบนกระดาษ A4 เติมขาวด้านล่าง
    const c=mk(cv.width,fitH);
    c.getContext('2d').drawImage(cv,0,0);
    out.push(await toBlob(c));
    return out;
  }

  // หลายหน้า: เว้นขอบ 2.5 ซม. ทุกด้าน (A4 กว้าง 210mm → ขอบ = 25/210 ของความกว้าง)
  const M=Math.round(cv.width*(25/210));
  const contentW=cv.width, pageW=contentW+2*M, pageH=Math.round(pageW*A4);
  const roomPx=pageH-2*M;
  const footPx=Math.round(34*S2);
  const band=cvResult.headBand||null;
  const hb=band?Math.max(0,Math.round(band[1]-band[0])):0;
  const tableEnd=Number(cvResult.tableEndPx)||0;
  const cuts=(cvResult.cutYs||[]).slice().sort((a,b)=>a-b);

  const pages=[];let yTop=0,guard=0;
  while(yTop<cv.height-1&&guard++<200){
    const room=(pages.length===0?roomPx:roomPx-hb)-footPx;
    let end=Math.min(yTop+room,cv.height);
    if(end<cv.height){
      const safe=cuts.filter(c=>c>yTop+room*0.3&&c<=end);
      if(safe.length)end=safe[safe.length-1];
    }
    if(end<=yTop)end=Math.min(yTop+room,cv.height);
    pages.push([yTop,end]);yTop=end;
  }
  for(let i=0;i<pages.length;i++){
    const [a,b]=pages[i],hpx=b-a;
    const withHead=i>0&&hb>0&&a<tableEnd;
    const off=withHead?hb:0;
    const c=mk(pageW,pageH);
    const x=c.getContext('2d');
    if(withHead)x.drawImage(cv,0,band[0],cv.width,hb,M,M,contentW,hb);
    x.drawImage(cv,0,a,cv.width,hpx,M,M+off,contentW,hpx);
    x.font='400 '+Math.round(12*S2)+'px "IBM Plex Sans Thai"';
    x.fillStyle='#999';x.textAlign='right';
    x.fillText(billNo+'   หน้า '+(i+1)+'/'+pages.length,pageW-M,M+off+hpx+Math.round(22*S2));
    out.push(await toBlob(c));
  }
  return out;
}

function blobToDataURL(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(fr.result);
    fr.onerror=()=>rej(fr.error);
    fr.readAsDataURL(blob);
  });
}

window.renderBill=async function(data){
  if(!data||!data.order||!data.billNo)throw new Error('renderBill: need {order, billNo}');
  // populate the globals the extracted functions read
  if(Array.isArray(data.products))products=data.products;
  if(Array.isArray(data.sales))sales=data.sales;
  if(data.appSettings)appSettings=data.appSettings;
  const extra=data.extra||data;   // extra fields may be nested or flattened on data
  const res=await drawBill(data.order,data.billNo,extra);
  let long=null;
  try{long=res.cv.toDataURL('image/png');}
  catch(e){console.warn('long-bill PNG export failed (tainted canvas?):',e);}
  const blobs=await billToA4Pages(res,data.billNo);
  const pages=[];
  for(const b of blobs)pages.push(await blobToDataURL(b));
  return {long,pages};
};
