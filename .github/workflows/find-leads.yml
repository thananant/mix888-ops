# Run from the GitHub app: Actions → "Find more Cloudbeds hotels" → Run workflow
name: Find more Cloudbeds hotels
on:
  workflow_dispatch:
    inputs:
      districts:
        description: 'เขตที่จะค้น ("all" = ทั้ง 50 เขต หรือใส่ชื่ออังกฤษคั่นด้วย , เช่น Watthana,Bang Rak)'
        default: 'all'
      max_per_search:
        description: 'จำนวนที่พักสูงสุดต่อการค้นหา 1 ครั้ง (40 = ประมาณ 6,000 แห่งถ้าค้นทุกเขต)'
        default: '40'
      kinds:
        description: 'ประเภทที่ค้น'
        default: 'hotel,hostel,serviced apartment'
permissions:
  contents: write
concurrency: find-leads
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl==3.1.5
      - name: Search Google Maps via Apify and check booking engines
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 hotel-leads/apify/find_leads.py --districts "${{ inputs.districts }}" --max "${{ inputs.max_per_search }}" --kinds "${{ inputs.kinds }}"
      - name: Rebuild page and spreadsheet
        run: python3 hotel-leads/build.py
      - name: Commit results
        run: |
          git config user.name "keys-lead-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hotel-leads
          git diff --cached --quiet && echo "no changes" || git commit -m "Apify: add newly found Cloudbeds hotels" && git push
